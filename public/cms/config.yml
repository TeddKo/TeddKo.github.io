  - name: project_sbi_cosmoney
    label: "프로젝트 상세 · SBI Cosmoney"
    file: src/data/projects/sbi-cosmoney.json
    icon: work
    fields:
      - { name: title, label: 제목, widget: string }
      - { name: role, label: 역할, widget: string }
      - { name: period, label: 기간, widget: string }
      - name: members
        label: 참여 인원
        widget: list
        field: &memberField { name: member, label: 인원, widget: string }
      - { name: intro, label: 소개, widget: markdown, required: false }
      - name: blocks
        label: 본문 블록
        widget: list
        typeKey: t
        collapsed: true
        summary: "{{fields.t}}"
        types: &blockTypes
          - name: p
            label: "문단 (p)"
            fields:
              - { name: x, label: 내용, widget: markdown }
          - name: bar
            label: "강조 바 (bar)"
            fields:
              - { name: x, label: 내용, widget: text }
          - name: ul
            label: "목록 (ul)"
            fields:
              - name: items
                label: 항목
                widget: list
                summary: "{{fields.x}}"
                fields:
                  - { name: x, label: 내용, widget: text }
                  - {
                      name: sub,
                      label: 하위 항목,
                      widget: list,
                      required: false,
                      field: { name: item, label: 항목, widget: text },
                    }
          - name: h
            label: "소제목 (h)"
            fields:
              - { name: x, label: 내용, widget: string }
          - name: fig
            label: "이미지 · 상대경로 (fig)"
            fields:
              - {
                  name: src,
                  label: 이미지,
                  widget: image,
                  media_folder: /src/assets/images,
                  public_folder: /src/assets/images,
                }
              - { name: alt, label: 대체 텍스트, widget: string }
          - name: svg
            label: "이미지 · public 경로 (svg)"
            fields:
              - {
                  name: src,
                  label: 이미지,
                  widget: image,
                  media_folder: /public/images/projects,
                  public_folder: /images/projects,
                }
              - { name: w, label: 너비(px), widget: number, value_type: int }
              - { name: h, label: 높이(px), widget: number, value_type: int }
              - { name: alt, label: 대체 텍스트, widget: string }
              - { name: caption, label: 캡션, widget: string, required: false }
          - name: note
            label: "참고 (note)"
            fields:
              - { name: x, label: 내용, widget: text }

